name: recettes_app
description: "Application Flutter multi-écrans de recettes de cuisine — navigation GoRouter, recherche/filtrage, formulaire avec validation, thème clair/sombre, UI responsive."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  provider: ^6.1.2
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
